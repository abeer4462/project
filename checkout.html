        </ul>
    </nav>
</header>

<main>
    <h1>إتمام الطلب</h1>
    <form action="checout.php" method="POST" id="orderForm">
        <fieldset>
            <legend>📍 معلومات الشحن</legend>
            <label for="email">البريد الإلكتروني:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="city">المدينة:</label>
            <input type="text" id="city" name="city" required><br><br>

            <label for="district">الحي:</label>
            <input type="text" id="district" name="district" required><br><br>

            <label for="street">الشارع:</label>
            <input type="text" id="street" name="street" required><br><br>

            <label for="postal-code">الرقم البريدي:</label>
            <input type="text" id="postal-code" name="postal-code" required><br><br>

            <label for="address-details">وصف إضافي للعنوان:</label>
            <textarea id="address-details" name="address-details"></textarea><br><br>
        </fieldset>

        <fieldset>
            <legend>💳 معلومات البطاقة</legend>
            <label for="card-number">رقم البطاقة:</label>
            <input type="text" id="card-number" name="card-number" required><br><br>

            <label for="card-name">الاسم على البطاقة:</label>
            <input type="text" id="card-name" name="card-name" required><br><br>

            <label for="card-expiry">تاريخ انتهاء البطاقة:</label>
            <input type="month" id="card-expiry" name="card-expiry" required><br><br>

            <label for="cvv">رمز الأمان (CVV):</label>
            <input type="text" id="cvv" name="cvv" maxlength="3" pattern="[0-9]{3}" required><br><br>
        </fieldset>

        <button type="button" onclick="submitOrder()">إتمام الطلب</button>
    </form>
</main>

<footer class="footer">
    <p>جميع الحقوق محفوظة &copy; Glistéra</p>
    <p>تابعونا على <a href="#">إنستقرام</a> | <a href="#">تويتر</a></p>
</footer>

<script>
function submitOrder() {
    const form = document.getElementById("orderForm");

    if (form.checkValidity()) {
        form.submit();
    } else {
        form.reportValidity();
    }
}
</script>

</body>
</html>
